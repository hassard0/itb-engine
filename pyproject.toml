[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itb"
version = "0.1.0"
description = "Information-Theoretic Bootstrap engine for quantum gravity theory-space exclusions"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.5",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.110",
    "h5py>=3.11",
    "pyarrow>=16",
    "uvicorn[standard]>=0.27",
    "plotly>=5.20",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
agent = [
    "anthropic>=0.40",
    "paramiko>=3.4",
]
remote = [
    "paramiko>=3.4",
]
gw = [
    "lalsuite>=7.7",
]

[project.scripts]
itb = "itb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
